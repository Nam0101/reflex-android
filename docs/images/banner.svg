<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Reflex for Android: one pure-Kotlin Core, rendered by Compose, driven by a CLI, tested in milliseconds">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97BFF"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="320" y2="0">
      <stop offset="0" stop-color="#A97BFF"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#A97BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A97BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7d8590"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="400" rx="24" fill="#0d1117"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow2)"/>

  <text x="72" y="92" class="mono" font-size="15" letter-spacing="3" fill="#7d8590">ANDROID · JETPACK COMPOSE · KOTLIN</text>
  <text x="68" y="168" class="sans" font-size="76" font-weight="800" fill="#e6edf3"><tspan fill="url(#title)">Reflex</tspan> for Android</text>
  <text x="72" y="220" class="sans" font-size="24" fill="#c9d1d9">One pure-Kotlin Core. Rendered by Compose,</text>
  <text x="72" y="254" class="sans" font-size="24" fill="#c9d1d9">driven by a CLI, tested in milliseconds.</text>

  <g class="sans" font-size="15" fill="#c9d1d9">
    <rect x="72" y="296" width="178" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="161" y="319" text-anchor="middle">Clean Architecture</text>
    <rect x="262" y="296" width="140" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="332" y="319" text-anchor="middle">Navigation 3</text>
    <rect x="414" y="296" width="164" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="496" y="319" text-anchor="middle">Behavior tests</text>
    <rect x="590" y="296" width="168" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <text x="674" y="319" text-anchor="middle">Agent-ready CLI</text>
  </g>

  <g class="sans">
    <rect x="880" y="56" width="320" height="76" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="1040" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Mobile</text>
    <text x="1040" y="114" text-anchor="middle" font-size="14" fill="#7d8590" class="mono">Compose views</text>

    <rect x="880" y="162" width="320" height="76" rx="16" fill="#161b22" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="1040" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">Core</text>
    <text x="1040" y="220" text-anchor="middle" font-size="14" fill="#7d8590" class="mono">pure JVM · the whole app</text>

    <rect x="880" y="268" width="320" height="76" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="1040" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#e6edf3">CLI</text>
    <text x="1040" y="326" text-anchor="middle" font-size="14" fill="#7d8590" class="mono">headless · tests · agents</text>
  </g>
  <g stroke="#7d8590" stroke-width="2" fill="none">
    <path d="M1010 136V158" marker-end="url(#arrow)"/>
    <path d="M1070 158V136" marker-end="url(#arrow)"/>
    <path d="M1010 264V242" marker-end="url(#arrow)"/>
    <path d="M1070 242V264" marker-end="url(#arrow)"/>
  </g>
  <g class="mono" font-size="12" fill="#7d8590">
    <text x="1002" y="152" text-anchor="end">action</text>
    <text x="1078" y="152">state</text>
    <text x="1002" y="258" text-anchor="end">ls / do</text>
    <text x="1078" y="258">JSON</text>
  </g>
</svg>
